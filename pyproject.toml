[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maskforge"
version = "0.1.0"
description = "A discrete diffusion language model implemented from scratch"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "tokenizers>=0.20",
    "numpy",
    "PyYAML"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]
serving = [
    "fastapi",
    "uvicorn"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
